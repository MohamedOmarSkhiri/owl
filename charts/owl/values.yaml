# Owl Helm chart values.
#
#   browser ──2300 (http) / 443 (https)──> relay (web app + API) <── agents (one per cluster)
#
# Quick start (watches the cluster it is installed in):
#   helm install owl ./charts/owl -n owl --create-namespace

image:
  relay:
    repository: ghcr.io/MohamedOmarSkhiri/owl-relay
    tag: ""            # defaults to the chart appVersion
    pullPolicy: IfNotPresent
  agent:
    repository: ghcr.io/MohamedOmarSkhiri/owl-agent
    tag: ""
    pullPolicy: IfNotPresent

imagePullSecrets: []   # e.g. [{name: ghcr-pull}] for private images

# Tokens: the app token signs you in to the web app, the agent token lets agents report.
# Left empty, random tokens are generated at install and kept across upgrades.
auth:
  existingSecret: ""   # Secret with keys "app-token" and "agent-token"
  appToken: ""
  agentToken: ""

# How the web app is reached.
service:
  type: ClusterIP      # ClusterIP (port-forward or ingress) | LoadBalancer | NodePort
  httpPort: 2300
  httpsPort: 443
  nodePorts:           # only for type NodePort (range 30000-32767)
    http: ""
    https: ""
  loadBalancerIP: ""
  annotations: {}

# HTTPS served by the relay itself on service port 443.
tls:
  enabled: true
  # selfSigned:  a certificate generated by Helm at install (browser shows a warning)
  # secret:      your own kubernetes.io/tls Secret (tls.secretName)
  # certManager: cert-manager issues and renews it (needs a public DNS name in hosts)
  mode: selfSigned
  hosts: []            # names and IPs the certificate covers, e.g. [owl.example.com, 203.0.113.10]
  secretName: ""       # mode=secret: name of the existing TLS Secret
  certManager:
    issuerRef:
      kind: ClusterIssuer
      name: letsencrypt-prod

# Optional: publish through an Ingress controller instead of (or as well as) the Service.
ingress:
  enabled: false
  className: ""        # traefik on K3s
  host: ""
  annotations: {}
  tls:
    secretName: ""     # empty = no TLS on the ingress

# Clusters to watch. One agent per entry.
#   No kubeconfig: the cluster Owl is installed in, through a read-only ServiceAccount (default).
#   kubeconfig: a specific cluster, from a kubeconfig you provide:
#     helm upgrade --install owl ./charts/owl -n owl \
#       --set-file 'clusters[1].kubeconfig=./prod-kubeconfig.yaml' --set 'clusters[1].name=prod'
#   existingSecret: a Secret you created yourself with the kubeconfig under the key "config".
# Kubeconfigs must embed their credentials (token or client certificate). Exec plugins
# (aws, gke-gcloud-auth-plugin) cannot run in the agent image.
clusters:
  - name: local
    kubeconfig: ""
    existingSecret: ""
    context: ""        # context inside the kubeconfig; empty = its current-context

# Read-only access for the in-cluster agent. Secrets are never granted.
rbac:
  create: true
  # API groups of CRDs you want to browse (core and built-in groups are always included).
  extraApiGroups:
    - gateway.networking.k8s.io
    - traefik.io
    - helm.cattle.io
    - k3s.cattle.io
    - cert-manager.io
    - acme.cert-manager.io
    - monitoring.coreos.com
    - argoproj.io

relay:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 128Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

agent:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
