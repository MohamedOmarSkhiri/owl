{{- $ns := .Release.Namespace -}}
{{- if not .Values.auth.existingSecret }}
{{- /* Generated once, then reused on every upgrade (lookup). */}}
{{- $name := include "owl.tokens.name" . }}
{{- $old := (lookup "v1" "Secret" $ns $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "owl.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  app-token: {{ .Values.auth.appToken | b64enc | default (get $old "app-token") | default (randAlphaNum 48 | b64enc) }}
  agent-token: {{ .Values.auth.agentToken | b64enc | default (get $old "agent-token") | default (randAlphaNum 48 | b64enc) }}
{{- end }}
{{- range .Values.clusters }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,38}[a-z0-9])?$" .name) }}
{{- fail (printf "clusters[].name %q must be lowercase letters, digits and '-' (max 40)" .name) }}
{{- end }}
{{- if .kubeconfig }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "owl.fullname" $ }}-kubeconfig-{{ .name }}
  labels: {{- include "owl.labels" $ | nindent 4 }}
type: Opaque
data:
  config: {{ .kubeconfig | b64enc }}
{{- end }}
{{- end }}
{{- if and .Values.tls.enabled (eq .Values.tls.mode "selfSigned") }}
---
{{- $name := include "owl.tls.name" . }}
{{- $old := (lookup "v1" "Secret" $ns $name).data | default dict }}
{{- $svc := include "owl.relay.name" . }}
{{- $ips := list "127.0.0.1" }}
{{- $dns := list "localhost" $svc (printf "%s.%s" $svc $ns) (printf "%s.%s.svc" $svc $ns) (printf "%s.%s.svc.cluster.local" $svc $ns) }}
{{- range .Values.tls.hosts }}
{{- if regexMatch "^[0-9.]+$" . }}{{ $ips = append $ips . }}{{ else }}{{ $dns = append $dns . }}{{ end }}
{{- end }}
{{- $cn := (first .Values.tls.hosts) | default $svc }}
{{- $cert := genSelfSignedCert $cn $ips $dns 3650 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "owl.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ get $old "tls.crt" | default ($cert.Cert | b64enc) }}
  tls.key: {{ get $old "tls.key" | default ($cert.Key | b64enc) }}
{{- end }}
