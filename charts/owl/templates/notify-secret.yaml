{{- /*
Tokens and webhook URLs for notifications. Created only when you set one in values
(not with notifications.existingSecret, which points at a Secret you manage yourself).
*/ -}}
{{- $n := .Values.notifications | default dict }}
{{- if and (include "owl.notify.hasSecret" .) (not $n.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "owl.notify.secretName" . }}
  labels: {{- include "owl.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with dig "telegram" "token" "" $n }}
  telegram-token: {{ . | quote }}
  {{- end }}
  {{- with dig "slack" "webhookUrl" "" $n }}
  slack-webhook: {{ . | quote }}
  {{- end }}
  {{- with dig "discord" "webhookUrl" "" $n }}
  discord-webhook: {{ . | quote }}
  {{- end }}
  {{- with dig "webhook" "url" "" $n }}
  webhook-url: {{ . | quote }}
  {{- end }}
{{- end }}
