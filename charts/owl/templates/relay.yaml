{{- $relay := include "owl.relay.name" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $relay }}
  labels: {{- include "owl.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay
spec:
  replicas: 1                # the relay keeps state in memory: exactly one replica
  strategy: {type: Recreate} # the old pod stops (and saves its history) before the new one mounts the volume
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: relay
      annotations:   # a new token or webhook in values restarts the relay, so it reads it
        checksum/notify: {{ toJson .Values.notifications | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false   # the relay never talks to the Kubernetes API
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "owl.podSecurity" . | nindent 8 }}
      containers:
        - name: relay
          image: {{ include "owl.relay.image" . }}
          imagePullPolicy: {{ .Values.image.relay.pullPolicy }}
          ports:
            - {name: http, containerPort: 2300}
            {{- if .Values.tls.enabled }}
            - {name: https, containerPort: 8443}   # non-root cannot bind 443; the Service maps 443 -> 8443
            {{- end }}
          env:
            - {name: RELAY_LISTEN, value: ":2300"}
            - {name: RELAY_DATA_DIR, value: /data}   # history file, see relay.persistence
            {{- if not .Values.relay.persistence.enabled }}
            - {name: RELAY_PERSISTENT, value: "false"}   # emptyDir: the app warns that history is lost on restart
            {{- end }}
            {{- $n := .Values.notifications | default dict }}
            {{- with $n.publicUrl }}
            - {name: RELAY_PUBLIC_URL, value: {{ . | quote }}}
            {{- end }}
            - {name: RELAY_NOTIFY_MIN_SEVERITY, value: {{ $n.minSeverity | default "critical" | quote }}}
            - {name: RELAY_NOTIFY_RESOLVED, value: {{ ne (toString $n.resolved) "false" | quote }}}
            - {name: RELAY_NOTIFY_COOLDOWN, value: {{ $n.cooldown | default "10m" | quote }}}
            {{- with dig "telegram" "chatId" "" $n }}
            - {name: RELAY_NOTIFY_TELEGRAM_CHAT_ID, value: {{ . | quote }}}
            {{- end }}
            {{- if include "owl.notify.hasSecret" . }}
            {{- $secret := include "owl.notify.secretName" . }}
            {{- range $key, $env := dict "telegram-token" "RELAY_NOTIFY_TELEGRAM_TOKEN" "slack-webhook" "RELAY_NOTIFY_SLACK_WEBHOOK" "discord-webhook" "RELAY_NOTIFY_DISCORD_WEBHOOK" "webhook-url" "RELAY_NOTIFY_WEBHOOK_URL" }}
            - name: {{ $env }}
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: {{ $key }}, optional: true}}   # optional: unset keys stay unset
            {{- end }}
            {{- end }}

            {{- if .Values.tls.enabled }}
            - {name: RELAY_TLS_LISTEN, value: ":8443"}
            - {name: RELAY_TLS_CERT, value: /tls/tls.crt}
            - {name: RELAY_TLS_KEY, value: /tls/tls.key}
            {{- end }}
            - name: RELAY_APP_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "owl.tokens.name" . }}, key: app-token}}
            - name: RELAY_AGENT_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "owl.tokens.name" . }}, key: agent-token}}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources: {{- toYaml .Values.relay.resources | nindent 12 }}
          securityContext: {{- include "owl.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}   # the only writable path: the root filesystem is read-only
            {{- if .Values.tls.enabled }}
            - {name: tls, mountPath: /tls, readOnly: true}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.relay.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.relay.persistence.existingClaim | default (printf "%s-data" $relay) }}
          {{- else }}
          emptyDir: {sizeLimit: 100Mi}
          {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ include "owl.tls.name" . }}
        {{- end }}
      {{- with .Values.relay.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.relay.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.relay.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $relay }}
  labels: {{- include "owl.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: relay
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePorts.http }}
      nodePort: {{ .Values.service.nodePorts.http }}
      {{- end }}
    {{- if .Values.tls.enabled }}
    - name: https
      port: {{ .Values.service.httpsPort }}
      targetPort: https
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePorts.https }}
      nodePort: {{ .Values.service.nodePorts.https }}
      {{- end }}
    {{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $relay }}
  labels: {{- include "owl.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.secretName }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $relay }}
                port: {name: http}
{{- end }}